                    <button className="modal-btn" onClick={() => setShowWeightModal(false)} style={{ marginTop: '10px' }}>Cancel</button>
                  </div>
                </div>
              )}

              {/* Edit Weight Modal */}
              {editingWeightIndex !== null && (
                <div className="cardio-modal" onClick={() => setEditingWeightIndex(null)}>
                  <div className="cardio-content" onClick={e => e.stopPropagation()}>
                    <div className="cardio-title" style={{ color: '#fbbf24' }}>Edit Entry</div>
                    <div style={{ fontSize: '11px', fontWeight: 700, color: 'rgba(255,255,255,0.4)', textTransform: 'uppercase', letterSpacing: '1px', marginBottom: '8px' }}>Date</div>
                    <input type="date" className="steps-date-input" value={editWeightDate} onChange={e => setEditWeightDate(e.target.value)} style={{ marginBottom: '10px' }} />
                    <div style={{ display: 'flex', gap: '8px', marginBottom: '12px' }}>
                      {['lbs', 'kg'].map(u => (
                        <button key={u} className={"steps-type-btn" + (editWeightUnit === u ? ' selected' : '')} style={editWeightUnit === u ? { background: 'rgba(251,191,36,0.25)', borderColor: '#fbbf24', color: '#fbbf24' } : {}} onClick={() => setEditWeightUnit(u)}>{u}</button>
                      ))}
                    </div>
                    <div style={{ fontSize: '11px', fontWeight: 700, color: 'rgba(255,255,255,0.4)', textTransform: 'uppercase', letterSpacing: '1px', marginBottom: '8px' }}>Weight</div>
                    <input type="number" step="0.1" className="calculator-input" value={editWeightValue} onChange={e => setEditWeightValue(e.target.value)} placeholder={'Weight (' + editWeightUnit + ')'} style={{ marginBottom: '14px' }} />
                    <button className="save-weight-btn" onClick={saveWeightEdit} disabled={!editWeightValue || parseFloat(editWeightValue) <= 0}>Save Changes</button>
                    <button className="modal-btn" onClick={() => setEditingWeightIndex(null)} style={{ marginTop: '10px' }}>Cancel</button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* ══════════════════════════════════════════════════════════════
             PHASES PAGE
          ══════════════════════════════════════════════════════════════ */}
          {page === 'phases' && (
            <div className="history-section">
              <button className="new-phase-btn" onClick={() => { setShowSavePhaseModal(true); setPhaseConfirmClear(false); }}>
                &#127942; Save Current Logs as Archive
              </button>

              {phases.length === 0 && (
                <div className="empty-state">
                  <div className="empty-state-icon" style={{ fontSize: '48px' }}>&#127942;</div>
                  <p>No archives saved yet</p>
                  <p style={{ fontSize: '14px', marginTop: '10px', opacity: 0.6 }}>Save your current logs as an archive and start fresh.</p>
                </div>
              )}

              {phases.map(phase => {
                const typeTag = phase.type || 'other';
                const fmtDate = iso => new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                const totalVol = phase.workoutHistory.reduce((t, w) => t + w.exercises.reduce((s, ex) => s + ex.sets.reduce((v, set) => v + (set.weight * set.reps), 0), 0), 0);
                const fmtVol = v => v >= 1000 ? (v/1000).toFixed(1)+'k' : String(v);
                return (
                  <div key={phase.id} className="phase-card" onClick={() => { setViewingPhase(phase); setPage('phaseDetail'); }}>
                    <div className="phase-card-header">
                      <div className="phase-card-name">{phase.name}</div>
                      <span className={"phase-type-tag " + typeTag}>{typeTag}</span>
                      <button className="phase-delete-btn" onClick={e => { e.stopPropagation(); deletePhase(phase.id); }}>&#10005;</button>
                    </div>
                    <div className="phase-card-dates">{fmtDate(phase.startDate)} → {fmtDate(phase.endDate)}</div>
                    <div className="phase-card-stats">
                      <div className="phase-stat"><div className="phase-stat-val">{phase.workoutHistory.length}</div><div className="phase-stat-label">Workouts</div></div>
                      <div className="phase-stat"><div className="phase-stat-val">{fmtVol(totalVol)}</div><div className="phase-stat-label">Total vol (lbs)</div></div>
                      {phase.cardioLog.length > 0 && <div className="phase-stat"><div className="phase-stat-val">{phase.cardioLog.length}</div><div className="phase-stat-label">Cardio</div></div>}
                      {phase.weightLog.length > 0 && (() => {
                        const sorted = [...phase.weightLog].sort((a,b) => new Date(a.date)-new Date(b.date));
                        const delta = sorted[sorted.length-1].weight - sorted[0].weight;
                        return <div className="phase-stat"><div className="phase-stat-val" style={{ color: delta <= 0 ? '#38bdf8' : '#4ade80' }}>{delta > 0 ? '+' : ''}{delta.toFixed(1)} {sorted[0].unit}</div><div className="phase-stat-label">Weight Δ</div></div>;
                      })()}
                    </div>
                  </div>
                );
              })}

              {/* Save phase modal */}
              {showSavePhaseModal && (
                <div className="phase-modal" onClick={() => setShowSavePhaseModal(false)}>
                  <div className="phase-modal-content" onClick={e => e.stopPropagation()}>
                    <div className="phase-modal-title">New Archive</div>
                    <div className="phase-modal-sub">Name this period, choose which data to include, then your logs will be archived and cleared so you can start fresh.</div>
                    <input
                      className="phase-name-input"
                      placeholder="Phase name (e.g. Summer Cut 2026)"
                      value={phaseName}
                      onChange={e => setPhaseName(e.target.value)}
                      autoFocus
                    />
                    <div className="phase-type-row">
                      {['diet', 'gaining', 'maintenance', 'other'].map(t => (
                        <button key={t} className={"phase-type-btn " + (phaseType === t ? 'selected' : '')} onClick={() => setPhaseType(t)}>{t.charAt(0).toUpperCase() + t.slice(1)}</button>
                      ))}
                    </div>
                    {/* ── Date range selector ── */}
                    <div style={{ marginBottom: '16px' }}>
                      <div style={{ fontSize: '11px', fontWeight: 700, color: 'rgba(255,255,255,0.4)', textTransform: 'uppercase', letterSpacing: '1px', marginBottom: '8px' }}>Data to include</div>
                      <div style={{ display: 'flex', gap: '8px', marginBottom: '10px' }}>
                        {[
                          { value: 'from_last', label: phases.length > 0 ? 'Since last archive' : 'All data' },
                          { value: 'custom', label: 'Date range' },
                          { value: 'all', label: 'All data' },
                        ].filter(o => !(o.value === 'all' && phases.length === 0)).map(o => (
                          <button key={o.value} className={"phase-type-btn " + (archiveMode === o.value ? 'selected' : '')} onClick={() => { setArchiveMode(o.value); setPhaseConfirmClear(false); }}>{o.label}</button>
                        ))}
                      </div>
                      {archiveMode === 'custom' && (
                        <div style={{ display: 'flex', gap: '8px' }}>
                          <div style={{ flex: 1 }}>
                            <div style={{ fontSize: '10px', color: 'rgba(255,255,255,0.4)', marginBottom: '4px' }}>From</div>
                            <input type="date" className="phase-name-input" style={{ marginBottom: 0, fontSize: '14px', padding: '10px 12px', colorScheme: 'dark' }} value={archiveStartDate} onChange={e => { setArchiveStartDate(e.target.value); setPhaseConfirmClear(false); }} />
                          </div>
                          <div style={{ flex: 1 }}>
                            <div style={{ fontSize: '10px', color: 'rgba(255,255,255,0.4)', marginBottom: '4px' }}>To</div>
                            <input type="date" className="phase-name-input" style={{ marginBottom: 0, fontSize: '14px', padding: '10px 12px', colorScheme: 'dark' }} value={archiveEndDate} onChange={e => { setArchiveEndDate(e.target.value); setPhaseConfirmClear(false); }} />
                          </div>
                        </div>
                      )}
                      {archiveMode === 'from_last' && phases.length > 0 && (
                        <div style={{ fontSize: '11px', color: 'rgba(255,255,255,0.35)' }}>
                          Last archive: {new Date(Math.max(...phases.map(p => new Date(p.savedAt)))).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}
                        </div>
                      )}
                    </div>
                    <div className="phase-warn">
                      ⚠️ Archived entries will be <strong>removed</strong> from your active logs. They will be saved inside this archive and you can revisit them anytime.
                    </div>
                    {!phaseConfirmClear ? (
                      <button className="phase-save-btn" disabled={!phaseName.trim()} onClick={() => setPhaseConfirmClear(true)}>
                        Archive &amp; Start Fresh
                      </button>
                    ) : (
                      <div className="confirm-clear-box">
                        <div className="confirm-clear-text">Are you sure? Active logs will be cleared. This cannot be undone.</div>
                        <button className="confirm-clear-btn" onClick={savePhase}>Yes, archive and clear logs</button>
                      </div>
                    )}
                    <button className="phase-cancel-btn" onClick={() => { setShowSavePhaseModal(false); setPhaseConfirmClear(false); setPhaseName(''); }}>Cancel</button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* ══════════════════════════════════════════════════════════════
             PHASE DETAIL PAGE
          ══════════════════════════════════════════════════════════════ */}
          {page === 'phaseDetail' && viewingPhase && (() => {
            const ph = viewingPhase;
            const fmtDate = iso => new Date(iso).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
            const totalVol = ph.workoutHistory.reduce((t, w) => t + w.exercises.reduce((s, ex) => s + ex.sets.reduce((v, set) => v + (set.weight * set.reps), 0), 0), 0);
            const totalSets = ph.workoutHistory.reduce((t, w) => t + w.exercises.reduce((s, ex) => s + ex.sets.filter(set => set.weight > 0 || set.reps > 0).length, 0), 0);
            const totalCardioMin = ph.cardioLog.reduce((t, c) => t + (parseInt(c.duration) || 0), 0);
            const totalSteps = ph.stepsLog.reduce((t, s) => t + (parseInt(s.steps) || 0), 0);
            const weightSorted = [...ph.weightLog].sort((a,b) => new Date(a.date)-new Date(b.date));
            const weightDelta = weightSorted.length >= 2 ? (weightSorted[weightSorted.length-1].weight - weightSorted[0].weight) : null;
            const muscleGroupCounts = {};
            ph.workoutHistory.forEach(w => { muscleGroupCounts[w.muscleGroup] = (muscleGroupCounts[w.muscleGroup] || 0) + 1; });
            const topGroups = Object.entries(muscleGroupCounts).sort((a,b) => b[1]-a[1]).slice(0,4);
            const typeTag = ph.type || 'other';
            return (
              <div className="history-section">
                <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '6px' }}>
                  <span className={"phase-type-tag " + typeTag} style={{ fontSize: '12px', padding: '4px 12px' }}>{typeTag}</span>
                  <span style={{ fontSize: '12px', opacity: 0.45 }}>{fmtDate(ph.startDate)} → {fmtDate(ph.endDate)}</span>
                </div>

                {/* Summary stats */}
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '20px', marginTop: '16px' }}>
                  {[
                    { val: ph.workoutHistory.length, label: 'Workouts' },
                    { val: totalSets, label: 'Total Sets' },
                    { val: totalVol >= 1000 ? (totalVol/1000).toFixed(1)+'k' : totalVol, label: 'Volume (lbs)' },
                    { val: totalCardioMin ? totalCardioMin + ' min' : '—', label: 'Cardio' },
                    { val: totalSteps ? (totalSteps/1000).toFixed(0)+'k' : '—', label: 'Steps' },
                    { val: weightDelta !== null ? (weightDelta > 0 ? '+' : '') + weightDelta.toFixed(1) + ' ' + (weightSorted[0]?.unit||'lbs') : '—', label: 'Weight Δ' },
                  ].map(({ val, label }) => (
                    <div key={label} style={{ background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: '12px', padding: '14px' }}>
                      <div style={{ fontSize: '22px', fontWeight: 700, color: '#ff6600' }}>{val}</div>
                      <div style={{ fontSize: '11px', opacity: 0.45, textTransform: 'uppercase', letterSpacing: '0.8px', marginTop: '2px' }}>{label}</div>
                    </div>
                  ))}
                </div>

                {/* Top muscle groups */}
                {topGroups.length > 0 && (
                  <div style={{ marginBottom: '20px' }}>
                    <div style={{ fontSize: '11px', fontWeight: 700, color: '#ff6600', textTransform: 'uppercase', letterSpacing: '1.5px', marginBottom: '10px' }}>Muscle Groups</div>
                    {topGroups.map(([group, count]) => (
                      <div key={group} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 14px', background: 'rgba(255,255,255,0.04)', borderRadius: '10px', marginBottom: '6px' }}>
                        <span style={{ fontWeight: 600 }}>{group}</span>
                        <span style={{ color: '#ff6600', fontWeight: 700 }}>{count} session{count !== 1 ? 's' : ''}</span>
                      </div>
                    ))}
                  </div>
                )}

                {/* Workout list */}
                {ph.workoutHistory.length > 0 && (
                  <div>
                    <div onClick={() => togglePhaseSection('workout')} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '11px', fontWeight: 700, color: '#ff6600', textTransform: 'uppercase', letterSpacing: '1.5px', marginBottom: phaseSections.workout ? '10px' : '0', cursor: 'pointer', userSelect: 'none' }}>
                      <span>Workout Log <span style={{ fontWeight: 400, opacity: 0.6 }}>({ph.workoutHistory.length})</span></span>
                      <div className={"expand-icon " + (phaseSections.workout ? 'expanded' : '')}><ChevronDown size={16} /></div>
                    </div>
                    {phaseSections.workout && [...ph.workoutHistory].sort((a,b) => new Date(b.date)-new Date(a.date)).map((w, i) => (
                      <div key={i} style={{ background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: '12px', padding: '14px', marginBottom: '8px' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
                          <span style={{ fontWeight: 700, color: '#ff6600' }}>{w.muscleGroup}</span>
                          <span style={{ fontSize: '12px', opacity: 0.45 }}>{fmtDate(w.date)}</span>
                        </div>
                        {w.exercises.filter(ex => ex.sets.some(s => s.weight > 0 || s.reps > 0)).map((ex, ei) => {
                          const filledSets = ex.sets.filter(s => s.weight > 0 || s.reps > 0);
                          const bestWeight = Math.max(...filledSets.map(s => s.weight || 0), 0);
                          const bestReps = Math.max(...filledSets.map(s => s.reps || 0), 0);
                          return (
                            <div key={ei} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '5px 0', borderTop: ei === 0 ? '1px solid rgba(255,255,255,0.06)' : 'none' }}>
                              <span style={{ fontSize: '12px', opacity: 0.75 }}>{ex.name}</span>
                              <span style={{ fontSize: '12px', color: 'rgba(255,102,0,0.8)', fontWeight: 600 }}>
                                {filledSets.length} set{filledSets.length !== 1 ? 's' : ''}
                                {bestWeight > 0 ? ' · ' + bestWeight + ' lbs' : ''}
                                {bestReps > 0 ? ' · ' + bestReps + ' reps' : ''}
                              </span>
                            </div>
                          );
                        })}
                      </div>
                    ))}
                  </div>
                )}

                {/* Cardio log */}
                {ph.cardioLog.length > 0 && (
                  <div style={{ marginTop: '20px' }}>
                    <div onClick={() => togglePhaseSection('cardio')} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '11px', fontWeight: 700, color: '#4ade80', textTransform: 'uppercase', letterSpacing: '1.5px', marginBottom: phaseSections.cardio ? '10px' : '0', cursor: 'pointer', userSelect: 'none' }}>
                      <span>Cardio Log <span style={{ fontWeight: 400, opacity: 0.6 }}>({ph.cardioLog.length})</span></span>
                      <div className={"expand-icon " + (phaseSections.cardio ? 'expanded' : '')}><ChevronDown size={16} /></div>
                    </div>
                    {phaseSections.cardio && [...ph.cardioLog].sort((a,b) => new Date(b.date)-new Date(a.date)).map((c, i) => {
                      const details = [];
                      if (c.speed != null) details.push(c.speed + ' mph');
                      if (c.incline != null) details.push(c.incline + '% incline');
                      if (c.resistance != null) details.push('res ' + c.resistance);
                      return (
                        <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 14px', background: 'rgba(255,255,255,0.03)', borderRadius: '10px', marginBottom: '6px' }}>
                          <div>
                            <div style={{ fontSize: '13px', fontWeight: 600, color: '#4ade80' }}>{c.type || 'Cardio'}</div>
                            <div style={{ fontSize: '11px', opacity: 0.45 }}>
                              {new Date(c.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}
                              {details.length > 0 ? ' · ' + details.join(' · ') : ''}
                            </div>
                          </div>
                          <span style={{ fontWeight: 700, color: '#4ade80' }}>{c.minutes} min</span>
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* Steps log */}
                {ph.stepsLog.length > 0 && (
                  <div style={{ marginTop: '20px' }}>
                    <div onClick={() => togglePhaseSection('steps')} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '11px', fontWeight: 700, color: '#38bdf8', textTransform: 'uppercase', letterSpacing: '1.5px', marginBottom: phaseSections.steps ? '10px' : '0', cursor: 'pointer', userSelect: 'none' }}>
                      <span>Steps Log <span style={{ fontWeight: 400, opacity: 0.6 }}>({ph.stepsLog.length})</span></span>
                      <div className={"expand-icon " + (phaseSections.steps ? 'expanded' : '')}><ChevronDown size={16} /></div>
                    </div>
                    {phaseSections.steps && [...ph.stepsLog].sort((a,b) => new Date(b.date)-new Date(a.date)).map((s, i) => (
                      <div key={i} style={{ display: 'flex', justifyContent: 'space-between', padding: '10px 14px', background: 'rgba(255,255,255,0.03)', borderRadius: '10px', marginBottom: '6px' }}>
                        <span style={{ fontSize: '13px', opacity: 0.6 }}>{new Date(s.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</span>
                        <span style={{ fontWeight: 700, color: '#38bdf8' }}>{parseInt(s.steps).toLocaleString()} steps</span>
                      </div>
                    ))}
                  </div>
                )}

                {/* Weight log */}
                {weightSorted.length > 0 && (
                  <div style={{ marginTop: '20px' }}>
                    <div onClick={() => togglePhaseSection('weight')} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '11px', fontWeight: 700, color: '#fbbf24', textTransform: 'uppercase', letterSpacing: '1.5px', marginBottom: phaseSections.weight ? '10px' : '0', cursor: 'pointer', userSelect: 'none' }}>
                      <span>Weight Log <span style={{ fontWeight: 400, opacity: 0.6 }}>({weightSorted.length})</span></span>
                      <div className={"expand-icon " + (phaseSections.weight ? 'expanded' : '')}><ChevronDown size={16} /></div>
                    </div>
                    {phaseSections.weight && weightSorted.slice().reverse().map((w, i) => (
                      <div key={i} style={{ display: 'flex', justifyContent: 'space-between', padding: '10px 14px', background: 'rgba(255,255,255,0.03)', borderRadius: '10px', marginBottom: '6px' }}>
                        <span style={{ fontSize: '13px', opacity: 0.6 }}>{new Date(w.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</span>
                        <span style={{ fontWeight: 700, color: '#fbbf24' }}>{w.weight} {w.unit}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })()}

          {/* ══════════════════════════════════════════════════════════════
             WORKOUT DETAIL VIEW
          ══════════════════════════════════════════════════════════════ */}
          {page === 'detail' && viewingWorkout && (
            <div className="detail-page">
              <div className="exercises-list">
                <div style={{ marginBottom: '20px' }}>
                  <div className="workout-date" style={{ fontSize: '14px', opacity: '0.7' }}><Calendar size={16} />{formatDate(viewingWorkout.date)}{workoutHasPR(viewingWorkout) && <span style={{ marginLeft: '8px', fontSize: '10px', fontWeight: 800, background: 'linear-gradient(135deg,#ffd700,#ffed4e)', color: '#000', padding: '2px 7px', borderRadius: '5px', letterSpacing: '0.5px', opacity: 1 }}>PR</span>}</div>
                  <div className="workout-stats" style={{ marginTop: '15px' }}>
                    <div className="stat"><div className="stat-label">Exercises</div><div className="stat-value">{getFilledExercisesCount(viewingWorkout)}</div></div>
                    <div className="stat"><div className="stat-label">Total Sets</div><div className="stat-value">{getFilledSetsCount(viewingWorkout)}</div></div>
                    <div className="stat">
                      <div className="stat-label">Volume</div>
                      <div className="stat-value">
                        {getTotalVolume(viewingWorkout).toLocaleString()}
                        {(() => {
                          const c = compareWithPrevious(viewingWorkout);
                          if (c && c.volumeDiff !== 0) {
                            const up = c.volumeDiff > 0;
                            return <span className={"progress-indicator " + (up ? 'up' : 'down')}>{up ? '\u2191' : '\u2193'} {Math.abs(c.volumePercent).toFixed(1)}%</span>;
                          }
                          return null;
                        })()}
                      </div>
                    </div>
                  </div>
                </div>
                {(() => {
                  const c = compareWithPrevious(viewingWorkout);
                  if (c?.previous) {
                    return (
                      <div className="previous-workout-section">
                        <div className="previous-workout-title">vs. {formatDate(c.previous.date)}</div>
                        <div style={{ fontSize: '13px', opacity: '0.8' }}>Previous Volume: {getTotalVolume(c.previous).toLocaleString()} lbs</div>
                      </div>
                    );
                  }
                  return null;
                })()}
                {viewingWorkout.exercises
                  .filter(exercise => exercise.sets.some(set => set.weight > 0 || set.reps > 0))
                  .map((exercise, exIndex) => {
                    const pr = getExercisePR(exercise.name, viewingWorkout.muscleGroup);
                    const maxSetWeight = Math.max(...exercise.sets.map(s => s.weight));
                    const isPR = maxSetWeight > 0 && maxSetWeight >= pr.maxWeight && pr.maxWeight > 0;
                    const previousWorkouts = workoutHistory
                      .filter(w => w.muscleGroup === viewingWorkout.muscleGroup && w.date !== viewingWorkout.date)
                      .sort((a, b) => new Date(b.date) - new Date(a.date));
                    const previousExercise = previousWorkouts[0]?.exercises.find(e => e.name === exercise.name);
                    return (
                      <div key={exIndex} className={"exercise-card " + (exercise.completed ? 'completed' : '')}>
                        <div className="exercise-header">
                          <div className="exercise-name">{exercise.name}{isPR && <span className="pr-badge">PR</span>}</div>
                        </div>
                        <div className="sets-list">
                          {exercise.sets.map((set, setIndex) => {
                            const prevSet = previousExercise?.sets[setIndex];
                            const weightImproved = prevSet && set.weight > prevSet.weight;
                            const repsImproved = prevSet && set.weight === prevSet.weight && set.reps > prevSet.reps;
                            const weightIsPR = set.weight > 0 && set.weight >= pr.maxWeight && pr.maxWeight > 0;
                            const repsIsPR = set.weight > 0 && set.reps > 0 && set.reps >= (pr.maxRepsPerWeight[set.weight] || 0) && (pr.maxRepsPerWeight[set.weight] || 0) > 0;
                            return (
                              <div key={setIndex}>
                                <div className="set-row readonly">
                                  <div className="set-number">{setIndex + 1}</div>
                                  <div className="set-input-group">
                                    <div className="set-input-label">Weight (lbs){weightIsPR && <span style={{ color: '#ffd700', marginLeft: '4px', fontSize: '9px', fontWeight: 800 }}>PR</span>}</div>
                                    <div className={"set-value" + (weightIsPR ? ' pr-gold' : '')}>{set.weight || 0}{!weightIsPR && weightImproved && <span style={{ color: '#4ade80', marginLeft: '4px' }}>&uarr;</span>}</div>
                                  </div>
                                  <div className="set-input-group">
                                    <div className="set-input-label">Reps{repsIsPR && <span style={{ color: '#ffd700', marginLeft: '4px', fontSize: '9px', fontWeight: 800 }}>PR</span>}</div>
                                    <div className={"set-value" + (repsIsPR ? ' pr-gold' : '')}>{set.reps || 0}{!repsIsPR && repsImproved && <span style={{ color: '#4ade80', marginLeft: '4px' }}>&uarr;</span>}</div>
                                  </div>
                                </div>
                                {prevSet && (
                                  <div className={"set-comparison " + ((weightImproved || repsImproved) ? 'improved' : '')}>
                                    Previous: {prevSet.weight}lbs x {prevSet.reps} reps
                                  </div>
                                )}
                                {(set.linked || []).map((lset, li) => (
                                  <div key={li} style={{ marginTop: '4px', marginLeft: '20px', paddingLeft: '10px', borderLeft: '2px solid ' + (lset.type === 'drop' ? 'rgba(168,85,247,0.4)' : 'rgba(56,189,248,0.4)'), padding: '5px 6px 5px 10px' }}>
                                    {lset.type === 'super' && lset.exerciseName && (
                                      <div style={{ fontSize: '11px', color: '#38bdf8', fontWeight: 600, marginBottom: '3px' }}>{lset.exerciseName}</div>
                                    )}
                                    <div style={{ display: 'flex', gap: '10px', alignItems: 'center' }}>
                                      <span style={{ fontSize: '9px', fontWeight: 800, textTransform: 'uppercase', color: lset.type === 'drop' ? '#a855f7' : '#38bdf8' }}>{lset.type === 'drop' ? 'DS' : 'SS'}</span>
                                      <span style={{ fontSize: '13px', fontWeight: 600 }}>{lset.weight || 0} lbs × {lset.reps || 0}</span>
                                    </div>
                                  </div>
                                ))}
                              </div>
                            );
                          })}
                        </div>
                        {exercise.notes ? <div className="exercise-notes-view">{exercise.notes}</div> : null}
                      </div>
                    );
                  })}
              </div>
            </div>
          )}

          {/* ══════════════════════════════════════════════════════════════
             ACTIVE WORKOUT PAGE
          ══════════════════════════════════════════════════════════════ */}
          {page === 'workout' && (
            <div className="workout-page">
              <div className="add-exercise-section" style={{ paddingBottom: 0 }}>
                <button className="add-exercise-btn" onClick={() => setShowAddExercise(true)}>
                  <Plus size={20} /> Add Custom Exercise
                </button>
              </div>

              <div className="exercises-list">
                {exercises.map((exercise, exIndex) => {
                  const pr = getExercisePR(exercise.name, currentWorkout.muscleGroup);
                  const maxSetWeight = Math.max(...exercise.sets.map(s => s.weight), 0);
                  const isPR = maxSetWeight > 0 && maxSetWeight >= pr.maxWeight && pr.maxWeight > 0;
                  const previousWorkouts = workoutHistory
                    .filter(w => w.muscleGroup === currentWorkout.muscleGroup)
                    .sort((a, b) => new Date(b.date) - new Date(a.date));
                  const previousExercise = previousWorkouts[0]?.exercises.find(e => e.name === exercise.name);

                  return (
                    <div key={exIndex} className={"exercise-card " + (exercise.completed ? 'completed' : '')}>
                      <div className="exercise-header">
                        <div className="exercise-name">
                          {exercise.name}
                          {isPR && <span className="pr-badge">NEW PR!</span>}
                        </div>
                        <div className="exercise-controls">
                          <button className="reorder-btn" onClick={() => moveExercise(exIndex, -1)} disabled={exIndex === 0}><ChevronUp size={14} /></button>
                          <button className="reorder-btn" onClick={() => moveExercise(exIndex, 1)} disabled={exIndex === exercises.length - 1}><ChevronDown size={14} /></button>
                          <div
                            className={"position-badge " + (reorderingExercise === exIndex ? 'active' : '')}
                            onClick={() => { if (reorderingExercise === exIndex) { setReorderingExercise(null); setReorderTargetPos(''); } else { setReorderingExercise(exIndex); setReorderTargetPos(String(exIndex + 1)); } }}
                            title="Move to position"
                          >{exIndex + 1}</div>
                          {reorderingExercise === exIndex && (
                            <>
                              <input
                                type="number"
                                className="reorder-pos-input"
                                value={reorderTargetPos}
                                min={1}
                                max={exercises.length}
                                autoFocus
                                onChange={e => setReorderTargetPos(e.target.value)}
                                onKeyDown={e => { if (e.key === 'Enter') moveExerciseTo(exIndex, parseInt(reorderTargetPos)); if (e.key === 'Escape') { setReorderingExercise(null); setReorderTargetPos(''); } }}
                              />
                              <button className="reorder-go-btn" onClick={() => moveExerciseTo(exIndex, parseInt(reorderTargetPos))}>Go</button>
                            </>
                          )}
                          <button className={"exercise-delete-btn " + (deleteExerciseConfirm === exIndex ? 'confirm' : '')} onClick={() => { if (deleteExerciseConfirm === exIndex) deleteExercise(exIndex); else armDeleteExercise(exIndex); }}>
                            {deleteExerciseConfirm === exIndex ? 'Delete?' : <Trash2 size={13} />}
                          </button>
                          <button className="exercise-plate-btn" onClick={() => setActiveExerciseCalc(exIndex)}>Plates</button>
                          <div className={"complete-checkbox " + (exercise.completed ? 'checked' : '')} onClick={() => toggleExerciseComplete(exIndex)}>
                            {exercise.completed && <Check size={18} />}
                          </div>
                        </div>
                      </div>

                      {previousExercise && (
                        <div style={{ fontSize: '11px', opacity: '0.6', marginBottom: '10px' }}>
                          Last workout: {previousExercise.sets.map(s => s.weight + 'x' + s.reps).join(', ')}
                        </div>
                      )}

                      <div className="sets-list">
                        {(() => {
                          const bestPRWeightValue = pr.maxWeight > 0
                            ? Math.max(...exercise.sets.filter(s => s.weight > pr.maxWeight).map(s => s.weight), -Infinity)
                            : -Infinity;
                          let prSetIndex = -1;
                          if (bestPRWeightValue > -Infinity) {
                            let bestReps = -1;
                            exercise.sets.forEach((s, i) => {
                              if (s.weight === bestPRWeightValue && s.reps > bestReps) {
                                bestReps = s.reps;
                                prSetIndex = i;
                              }
                            });
                          }
                          return exercise.sets.map((set, setIndex) => {
                          const prevSet = previousExercise?.sets[setIndex];
                          const weightImproved = prevSet && set.weight > prevSet.weight;
                          const repsImproved = prevSet && set.weight === prevSet.weight && set.reps > prevSet.reps;
                          const showImprovement = (weightImproved || repsImproved) && set.weight > 0 && set.reps > 0;
                          const weightIsPR = setIndex === prSetIndex;
                          const repsIsPR = setIndex === prSetIndex;
                          return (
                            <div key={setIndex}>
                              <div className="set-row">
                                <div className="set-number">
                                  {setIndex + 1}
                                  {showImprovement && <div style={{ color: '#4ade80', fontSize: '16px' }}>&uarr;</div>}
                                </div>
                                <div className="set-input-group">
                                  <div className="set-input-label">Weight (lbs){weightIsPR && <span style={{ color: '#ffd700', marginLeft: '4px', fontSize: '9px', fontWeight: 800 }}>PR</span>}</div>
                                  <input type="number" className={"set-input" + (weightIsPR ? ' pr-gold' : '')} value={set.weight || ''} onChange={e => updateSet(exIndex, setIndex, 'weight', e.target.value)} placeholder="0" style={!weightIsPR && weightImproved && set.weight > 0 ? { borderColor: '#4ade80', background: 'rgba(74,222,128,0.1)' } : {}} />
                                  {set.weight > 45 && <div style={{ fontSize: '10px', color: 'rgba(255,165,0,0.7)', marginTop: '4px', textAlign: 'center', lineHeight: 1.3 }}>{calculatePlates(set.weight)}</div>}
                                </div>
                                <div className="set-input-group">
                                  <div className="set-input-label">Reps{repsIsPR && <span style={{ color: '#ffd700', marginLeft: '4px', fontSize: '9px', fontWeight: 800 }}>PR</span>}</div>
                                  <input type="number" className={"set-input" + (repsIsPR ? ' pr-gold' : '')} value={set.reps || ''} onChange={e => updateSet(exIndex, setIndex, 'reps', e.target.value)} placeholder="0" style={!repsIsPR && repsImproved && set.reps > 0 ? { borderColor: '#4ade80', background: 'rgba(74,222,128,0.1)' } : {}} />
                                </div>
                                {exercise.sets.length > 1 && (
                                  <button className="remove-set-btn" onClick={() => removeSet(exIndex, setIndex)}>x</button>
                                )}
                              </div>
                              <div style={{ display: 'flex', gap: '6px', marginLeft: '20px', marginBottom: '2px' }}>
                                <button className="add-linked-btn" onClick={() => addLinkedSet(exIndex, setIndex, 'drop')}>
                                  <span className="add-linked-pill drop">+ DS</span>
                                </button>
                                <button className="add-linked-btn" onClick={() => addLinkedSet(exIndex, setIndex, 'super')}>
                                  <span className="add-linked-pill super">+ SS</span>
                                </button>
                              </div>
                              {(set.linked || []).map((lset, li) => (
                                <div key={li} style={{ marginTop: '6px', marginLeft: '20px', paddingLeft: '10px', borderLeft: '2px solid ' + (lset.type === 'drop' ? 'rgba(239,68,68,0.4)' : 'rgba(168,85,247,0.5)'), borderRadius: '0 6px 6px 0', padding: '6px 6px 6px 10px' }}>
                                  {lset.type === 'super' && (
                                    <input
                                      type="text"
                                      className="linked-input"
                                      value={lset.exerciseName || ''}
                                      onChange={e => updateLinkedSet(exIndex, setIndex, li, 'exerciseName', e.target.value)}
                                      placeholder="Paired exercise name"
                                      style={{ width: '100%', marginBottom: '6px', fontSize: '13px', textAlign: 'left', borderColor: 'rgba(168,85,247,0.4)' }}
                                    />
                                  )}
                                  <div className={"linked-set-row " + lset.type} style={{ margin: 0, padding: 0, border: 'none', borderRadius: 0 }}>
                                    <span className={"linked-type-badge " + lset.type}>{lset.type === 'drop' ? 'DS' : 'SS'}</span>
                                    <div className="set-input-group">
                                      <div className="set-input-label">lbs</div>
                                      <input type="number" className="linked-input" value={lset.weight || ''} onChange={e => updateLinkedSet(exIndex, setIndex, li, 'weight', e.target.value)} placeholder="0" />
                                    </div>
                                    <div className="set-input-group">
                                      <div className="set-input-label">reps</div>
                                      <input type="number" className="linked-input" value={lset.reps || ''} onChange={e => updateLinkedSet(exIndex, setIndex, li, 'reps', e.target.value)} placeholder="0" />
                                    </div>
                                    <button className="linked-remove-btn" onClick={() => removeLinkedSet(exIndex, setIndex, li)}>x</button>
                                  </div>
                                </div>
                              ))}
                            </div>
                          );
                        });
                        })()}
                      </div>

                      <button className="add-set-btn" onClick={() => addSet(exIndex)}>
                        <Plus size={16} /> Add Set
                      </button>

                      <textarea className="exercise-notes" value={exercise.notes || ''} onChange={e => updateNote(exIndex, e.target.value)} placeholder="Notes..." rows={1} />
                    </div>
                  );
                })}
              </div>

              <button className="finish-workout-btn" onClick={finishWorkout}>
                <Check size={18} /> Finish Workout
              </button>

              {/* Plate calculator per exercise */}
              {activeExerciseCalc !== null && (
                <div className="calculator-modal" onClick={() => { setActiveExerciseCalc(null); setExercisePlates45(''); }}>
                  <div className="calculator-content" onClick={e => e.stopPropagation()}>
                    <div className="calculator-title">{exercises[activeExerciseCalc]?.name}</div>
                    <div className="result-label" style={{ marginBottom: '10px' }}>45lb Plates per side - Add set</div>
                    <input type="number" className="calculator-input" value={exercisePlates45} onChange={e => setExercisePlates45(e.target.value)} placeholder="# of 45lb plates per side" />
                    {exercisePlates45 && (
                      <div className="calculator-result">
                        <div className="result-label">Total weight</div>
                        <div className="result-value">{calculateWeightFrom45s(parseFloat(exercisePlates45))} lbs</div>
                      </div>
                    )}
                    <div className="modal-btn-group" style={{ marginTop: '20px' }}>
                      <button className="modal-btn-primary" onClick={() => applyPlatesWeightToExercise(activeExerciseCalc)} disabled={!exercisePlates45}>Add Set with Weight</button>
                      <button className="modal-btn-secondary" onClick={() => { setActiveExerciseCalc(null); setExercisePlates45(''); }}>Cancel</button>
                    </div>
                  </div>
                </div>
              )}

              {/* Global plate calculator */}
              {showPlateCalculator && (
                <div className="calculator-modal" onClick={() => { setShowPlateCalculator(false); setPlateWeight(''); setNumPlates45(''); }}>
                  <div className="calculator-content" onClick={e => e.stopPropagation()}>
                    <div className="calculator-title">Plate Calculator</div>
                    <div style={{ marginBottom: '30px' }}>
                      <div className="result-label" style={{ marginBottom: '10px' }}>Weight - Plates per side</div>
                      <input type="number" className="calculator-input" value={plateWeight} onChange={e => setPlateWeight(e.target.value)} placeholder="Enter total weight (lbs)" />
                      {plateWeight && (
                        <div className="calculator-result">
                          <div className="result-label">Plates per side</div>
                          <div className="result-value">{calculatePlates(parseFloat(plateWeight))}</div>
                        </div>
                      )}
                    </div>
                    <div>
                      <div className="result-label" style={{ marginBottom: '10px' }}>45lb Plates - Total weight</div>
                      <input type="number" className="calculator-input" value={numPlates45} onChange={e => setNumPlates45(e.target.value)} placeholder="# of 45lb plates per side" />
                      {numPlates45 && (
                        <div className="calculator-result">
                          <div className="result-label">Total weight</div>
                          <div className="result-value">{calculateWeightFrom45s(parseFloat(numPlates45))} lbs</div>
                        </div>
                      )}
                    </div>
                    <button className="modal-btn" onClick={() => { setShowPlateCalculator(false); setPlateWeight(''); setNumPlates45(''); }}>Close</button>
                  </div>
                </div>
              )}

              {/* Add exercise modal */}
              {showAddExercise && currentWorkout && (() => {
                // Build full exercise library: history + custom + defaults for current group
                const inWorkout = new Set(exercises.map(e => e.name));
                const allNames = new Set();
                workoutHistory.forEach(w => w.exercises.forEach(ex => allNames.add(ex.name)));
                Object.values(customExercises).flat().forEach(n => allNames.add(n));
                (MUSCLE_GROUPS[currentWorkout.muscleGroup] || []).forEach(n => allNames.add(n));

                // Last performance lookup
                const lastPerf = (name) => {
                  const sorted = [...workoutHistory].sort((a, b) => new Date(b.date) - new Date(a.date));
                  for (const w of sorted) {
                    const ex = w.exercises.find(e => e.name === name);
                    if (ex) {
                      const filled = ex.sets.filter(s => s.weight > 0 || s.reps > 0);
                      if (filled.length > 0) {
                        const dateStr = new Date(w.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                        const summary = filled.map(s => (s.weight > 0 ? s.weight + 'lb' : '') + (s.weight > 0 && s.reps > 0 ? '×' : '') + (s.reps > 0 ? s.reps : '')).join(' · ');
                        return dateStr + ' — ' + summary;
                      }
                    }
                  }
                  return null;
                };

                const q = exerciseSearch.trim().toLowerCase();
                const known = [...allNames].filter(n => !q || n.toLowerCase().includes(q));
                const isNew = q && ![...allNames].some(n => n.toLowerCase() === q);
                const currentGroupDefault = new Set(MUSCLE_GROUPS[currentWorkout.muscleGroup] || []);

                // Build name→group lookup: MUSCLE_GROUPS, then customExercises, then workoutHistory
                const nameToGroup = {};
                Object.entries(MUSCLE_GROUPS).forEach(([g, names]) => names.forEach(n => { nameToGroup[n] = g; }));
                Object.entries(customExercises).forEach(([g, names]) => names.forEach(n => { if (!nameToGroup[n]) nameToGroup[n] = g; }));
                [...workoutHistory].sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(w => {
                  w.exercises.forEach(ex => { if (!nameToGroup[ex.name]) nameToGroup[ex.name] = w.muscleGroup || 'Other'; });
                });

                // Sort: current group first, then other groups A-Z, within each group A-Z
                const curMg = currentWorkout.muscleGroup;
                known.sort((a, b) => {
                  const ga = nameToGroup[a] || 'Other', gb = nameToGroup[b] || 'Other';
                  const aCur = ga === curMg ? 0 : 1, bCur = gb === curMg ? 0 : 1;
                  if (aCur !== bCur) return aCur - bCur;
                  if (ga !== gb) return ga.localeCompare(gb);
                  return a.localeCompare(b);
                });

                return (
                  <div className="add-exercise-modal" onClick={() => { setShowAddExercise(false); setExerciseSearch(''); }}>
                    <div className="add-exercise-content" onClick={e => e.stopPropagation()}>
                      <div className="add-exercise-title">Add Exercise</div>
                      <input
                        className="exercise-input"
                        value={exerciseSearch}
                        onChange={e => setExerciseSearch(e.target.value)}
                        placeholder="Search or type new exercise…"
                        autoFocus
                        onKeyDown={e => { if (e.key === 'Enter' && exerciseSearch.trim()) addCustomExercise(exerciseSearch.trim()); }}
                      />
                      <div className="ex-list">
                        {(() => {
                          let lastGroup = null;
                          return known.map(name => {
                            const perf = lastPerf(name);
                            const isDefault = currentGroupDefault.has(name);
                            const group = nameToGroup[name] || 'Other';
                            const showHeader = group !== lastGroup;
                            lastGroup = group;
                            return (
                              <React.Fragment key={name}>
                                {showHeader && <div className="ex-section-label" style={{ marginTop: lastGroup !== group ? '8px' : '0' }}>{group}</div>}
                                <div className="ex-row" onClick={() => !inWorkout.has(name) && addCustomExercise(name)} style={inWorkout.has(name) ? { opacity: 0.4, cursor: 'default' } : {}}>
                                  <div className="ex-row-left">
                                    <div className="ex-row-name">{name}{isDefault && !perf && <span className="ex-new-badge">default</span>}</div>
                                    {perf && <div className="ex-row-last">{perf}</div>}
                                    {!perf && !isDefault && <div className="ex-row-last">No history yet</div>}
                                  </div>
                                  {inWorkout.has(name)
                                    ? <div style={{ color: '#4ade80', fontSize: '16px', flexShrink: 0 }}>✓</div>
                                    : <div className="ex-row-add">+</div>}
                                </div>
                              </React.Fragment>
                            );
                          });
                        })()}
                        {isNew && (
                          <>
                            <div className="ex-section-label" style={{ marginTop: '6px' }}>New exercise</div>
                            <div className="ex-row" style={{ borderColor: 'rgba(255,102,0,0.35)' }} onClick={() => addCustomExercise(exerciseSearch.trim())}>
                              <div className="ex-row-left">
                                <div className="ex-row-name">{exerciseSearch.trim()} <span className="ex-new-badge">NEW</span></div>
                                <div className="ex-row-last">Will be saved to your library</div>
                              </div>
                              <div className="ex-row-add">+</div>
                            </div>
                          </>
                        )}
                        {known.length === 0 && !isNew && q && (
                          <div style={{ textAlign: 'center', padding: '30px 0', opacity: 0.4, fontSize: '14px' }}>
                            No match — type a new name and press Enter
                          </div>
                        )}
                      </div>
                      <button className="modal-btn-secondary" style={{ flex: 'none', padding: '8px 24px', fontSize: '13px', width: 'auto', alignSelf: 'center' }} onClick={() => { setShowAddExercise(false); setExerciseSearch(''); }}>Cancel</button>
                    </div>
                  </div>
                );
              })()}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<WorkoutTracker />);
  </script>
</body>
</html>
